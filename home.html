<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NTSH • Home</title>

  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/home.css" />
</head>

<body data-page="home">

<header class="topbar">
  <div class="logo">NTSH</div>
  <a href="/profile.html" class="profile-link">Profile</a>
</header>

<main class="wrap">
  <section class="gallery glass">
    <h2>Featured Art</h2>
    <div id="gallery" class="grid"></div>
  </section>
</main>

<!-- Art modal -->
<div id="artModal" class="modal hidden">
  <div class="modal-content glass">
    <img id="modalImage" />
    <h3 id="modalTitle"></h3>

    <div class="reactions">
      <button data-emoji="⭐️">⭐️</button>
      <button data-emoji="🔥">🔥</button>
      <button data-emoji="💎">💎</button>
      <button data-emoji="😍">😍</button>
      <button data-emoji="👍">👍</button>
    </div>

    <button id="closeModal">Close</button>
  </div>
</div>

<img
  src="/assets/images/ntsh-mask-favicon-logo.png"
  class="easter-egg"
  alt="NTSH Easter Egg"
/>

<script type="module" src="/assets/js/supabase-client.js"></script>
<script type="module" src="/assets/js/auth-guard.js"></script>
<script type="module" src="/assets/js/gallery.js"></script>
<script type="module" src="/assets/js/reactions.js"></script>


</body
</html>
