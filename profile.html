<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NTSH • Profile</title>

  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/profile.css" />
</head>

<body>
<body data-page="profile">
<header class="topbar">
  <div class="logo">NTSH</div>
  <a href="/home.html">Home</a>
</header>

<main class="wrap">

  <section class="profile-card">
    <h1 id="username">username_here</h1>
    <p id="role">guest</p>

    <div class="socials">
      <a href="#">Instagram</a>
      <a href="#">TikTok</a>
    </div>

<h2 id="profileName"></h2>
<p id="profileRole"></p>

<div id="profileSocials"></div>
<div id="profileActions"></div>

<div id="profileGallery"></div>



    
   <button id="uploadArtBtn" onclick="openModal('uploadModal')">
  Upload Artwork
</button>

<div id="uploadModal" class="modal">
  <form id="uploadForm">
    <input id="artTitle" required placeholder="Title">
    <input id="artFile" type="file" required>
    <button type="submit">Submit</button>
  </form>
</div>


    <button id="adminPanel" hidden>Admin Panel</button>
  </section>

</main>

  
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/modal.js"></script>
<!-- index + home -->
<script defer src="/assets/js/profile.js"></script>
<script src="/assets/js/easter-egg.js"></script>
  <script src="/assets/js/upload.js"></script>
<script src="/assets/js/supabase-client.js"></script>

<div id="uploadModal" class="modal hidden">
  <div class="modal-content">
    <h3>Upload Artwork</h3>

    <input id="artTitle" type="text" placeholder="Title" />
    <textarea id="artDesc" placeholder="Description"></textarea>

    <input id="artFile" type="file" accept="image/*" />

    <button id="submitArt">Submit</button>
    <button id="closeUpload">Cancel</button>
  </div>
</div>

  
</body>
</html>
