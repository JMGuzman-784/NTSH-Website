<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>NTSH — Profile</title>

  <link rel="stylesheet" href="assets/css/gallery.css?v=1" />
  <link rel="stylesheet" href="assets/css/account-ui.css?v=1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script defer src="assets/js/account-ui.js?v=1"></script>
</head>
<!-- =========================
     PROFILE PAGE
========================= -->

<div class="profile-page">

  <!-- LEFT PANEL -->
  <aside class="profile-card">
    <h2 id="profileName">Loading…</h2>
    <p id="profileRole">viewer • NTSH</p>

    <div class="socials">
      <a id="igLink" style="display:none">Instagram</a>
      <a id="ttLink" style="display:none">TikTok</a>
    </div>

    <h3>Artist</h3>

    <!-- UPLOAD BUTTON -->
    <button id="uploadBtn" class="primary-btn">
      Upload Your Art
    </button>

    <!-- ADMIN PANEL BUTTON -->
    <button id="adminPanelBtn" class="secondary-btn" style="display:none">
      Admin Panel
    </button>

    <hr />

    <h3>Portfolio</h3>
    <div id="portfolioGrid" class="portfolio-grid"></div>

    <a href="/home.html" class="back-link">← Back to Home</a>
  </aside>

</div>

<!-- =========================
     UPLOAD MODAL
========================= -->

<div id="uploadModal" class="modal hidden">
  <div class="modal-card">

    <h2>Upload Artwork</h2>

    <input
      id="artTitle"
      type="text"
      placeholder="Title (optional)"
    />

    <textarea
      id="artDescription"
      placeholder="Describe this piece (optional)"
    ></textarea>

    <!-- ⚠️ ONLY ONE FILE INPUT -->
    <input
      id="fileInput"
      type="file"
      accept="image/*"
    />

    <div class="modal-actions">
      <button id="cancelUpload" class="secondary-btn">Cancel</button>
      <button id="confirmUpload" class="primary-btn">Upload</button>
    </div>

  </div>
</div>

</html>
