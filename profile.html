<!doctype html>
<html lang="en">

  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/profile.css" />
</head>

<body>
<body data-page="profile">
<header class="topbar">
  <div class="logo">NTSH</div>
  <a href="/home.html">Home</a>
</header>

<main class="wrap">

  <section class="profile-card">
    <h1 id="username">username_here</h1>
    <p id="role">guest</p>

    <div class="socials">
      <a href="#">Instagram</a>
      <a href="#">TikTok</a>
    </div>

    <button id="uploadArt">Upload Art</button>
    <button id="adminPanel" hidden>Admin Panel</button>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/state.js"></script>
<script src="/assets/js/router.js"></script>

<!-- page-specific -->

<script src="/assets/js/home.js"></script>     <!-- home -->
<script src="/assets/js/profile.js"></script>
<script src="/assets/js/admin.js"></script>
<script src="/assets/js/easter-egg.js"></script>
  <script src="/assets/js/upload.js"></script>


<div id="uploadModal" class="modal hidden">
  <div class="modal-content">
    <h3>Upload Artwork</h3>

    <input id="artTitle" type="text" placeholder="Title" />
    <textarea id="artDesc" placeholder="Description"></textarea>

    <input id="artFile" type="file" accept="image/*" />

    <button id="submitArt">Submit</button>
    <button id="closeUpload">Cancel</button>
  </div>
</div>

  
</body>
