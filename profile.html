<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NTSH • Profile</title>
  <link rel="stylesheet" href="/css/account-ui.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/js/account-ui.js"></script>
</head>

<body>

<!-- HEADER -->
<header>
  <button id="accountBtn">
    <span id="accountAvatar">?</span>
    <span id="accountName">Loading</span>
    <span id="roleBadge">viewer</span>
  </button>

  <div id="accountMenu" class="menu">
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<!-- PROFILE CARD -->
<section>
  <span id="accountUser"></span>

  <h1 id="profileName">Loading...</h1>
  <p id="profileRole">viewer • NTSH</p>

  <div id="artistActions" style="display:none;">
    <button id="uploadBtn">Upload Your Art</button>
    <button id="adminPanelBtn" style="display:none;">Admin Panel</button>
  </div>
</section>

<!-- PORTFOLIO -->
<section>
  <h2>Portfolio</h2>
  <div id="portfolioGrid"></div>
</section>

<!-- UPLOAD MODAL -->
<div id="uploadModal" class="modal hidden">
  <div class="modal-content">
    <h3>Upload Artwork</h3>

    <input id="fileInput" type="file" accept="image/*" />
    <input id="artTitle" type="text" placeholder="Title (optional)" />
    <textarea id="artDescription" placeholder="Description (optional)"></textarea>

    <div class="modal-actions">
      <button id="confirmUpload">Submit</button>
      <button id="cancelUpload">Cancel</button>
    </div>
  </div>
</div>

</body>
</html>
