<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NTSH • Profile</title>

  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/profile.css" />
</head>

<body data-page="profile">

<header class="topbar">
  <div class="logo">NTSH</div>
  <a href="/home.html">Home</a>
</header>

<main class="wrap">

  <section class="profile-card glass">
    <h1 id="profileName">username</h1>
    <p id="profileRole">role</p>

    <div class="socials">
      <a href="#" id="igLink">Instagram</a>
      <a href="#" id="ttLink">TikTok</a>
    </div>

    <div class="profile-actions">
      <button id="uploadArtBtn" class="hidden">Upload Artwork</button>
      <button id="adminPanelBtn" class="hidden">Admin Panel</button>
      <button id="createGuestBtn" class="hidden">Create Guest Account</button>
    </div>

    <div id="profileGallery"></div>
  </section>

</main>

<!-- Upload modal -->
<div id="uploadModal" class="modal hidden">
  <div class="modal-content glass">
    <h3>Upload Artwork</h3>
    <form id="uploadForm">
      <input id="artTitle" placeholder="Title" required />
      <textarea id="artDesc" placeholder="Description"></textarea>
      <input id="artFile" type="file" accept="image/*" required />
      <button type="submit">Submit</button>
      <button type="button" id="closeUpload">Cancel</button>
    </form>
  </div>
</div>

<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/auth-guard.js"></script>
<script src="/assets/js/profile.js"></script>
<script src="/assets/js/upload.js"></script>
<script src="/assets/js/modal.js"></script>

</body>
</html>
