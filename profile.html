<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NTSH • Profile</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/account-ui.css" />
  <link rel="stylesheet" href="/css/gallery.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App JS -->
  <script defer src="/js/account-ui.js"></script>
</head>

<body>

<!-- =========================
     HEADER
========================= -->
<header class="top-bar">
  <button id="accountBtn" class="account-pill">
    <span id="accountAvatar">?</span>
    <span id="accountName">Loading</span>
    <span id="roleBadge">viewer</span>
  </button>

  <div id="accountMenu" class="menu">
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<!-- =========================
     PROFILE + CONTENT
========================= -->
<div class="profile-wrapper">

  <!-- LEFT: PROFILE CARD -->
  <aside class="profile-card">
    <span id="accountUser">@user</span>

    <h1 id="profileName">Loading...</h1>
    <p id="profileRole">viewer • NTSH</p>

    <div id="artistActions" style="display:none;">
      <button id="uploadBtn" class="btn btn-primary">
        Upload Your Art
      </button>

      <button id="adminPanelBtn"
              class="btn btn-secondary"
              style="display:none;">
        Admin Panel
      </button>
    </div>
  </aside>

  <!-- RIGHT: PORTFOLIO -->
  <main class="profile-content">
    <h2>Portfolio</h2>
    <div id="portfolioGrid" class="gallery-grid"></div>
  </main>

</div>

<!-- =========================
     UPLOAD MODAL
========================= -->
<div id="uploadModal" class="modal hidden">
  <div class="modal-content">

    <h3>Upload Artwork</h3>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    />

    <input
      id="artTitle"
      type="text"
      placeholder="Title (optional)"
    />

    <textarea
      id="artDescription"
      placeholder="Description (optional)"
    ></textarea>

    <div class="modal-actions">
      <button id="confirmUpload" class="btn btn-primary">
        Submit
      </button>
      <button id="cancelUpload" class="btn btn-secondary">
        Cancel
      </button>
    </div>

  </div>
</div>

</body>
</html>
