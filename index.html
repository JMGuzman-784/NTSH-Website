<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NTSH — Enter</title>

  <!-- Entry styles -->
  <link rel="stylesheet" href="/assets/css/auth-entry.css" />

  <!-- Supabase (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Supabase client -->
  <script src="/assets/js/supabase-client.js"></script>

  <!-- Auth Router -->
  <script defer src="/assets/js/auth-router.js"></script>

  <link rel="icon" href="/assets/images/Raid'sNTSHLogo.png">
</head>

<body>
  <main class="entry">

    <section class="card">
      <h1 class="logo">NTSH</h1>
      <p class="subtitle">Nothing To See Here</p>
      <p class="tagline">Only Art That Speaks</p>

      <div class="actions">
        <button id="enterViewer">👀 Continue as Viewer</button>
        <button id="openLogin">🔐 Log In / Sign Up</button>
      </div>

      <p class="hint">
        Viewers browse • Members react & comment • Artists upload
      </p>
    </section>

    <!-- LOGIN MODAL -->
    <section id="loginModal" class="modal hidden">
      <form id="loginForm" class="login-card">
        <h2>Log in to NTSH</h2>

        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />

        <button type="submit">Log In / Sign Up</button>

        <button type="button" id="closeLogin" class="ghost">Cancel</button>
      </form>
    </section>

  </main>
</body>
</html>
