<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NTSH</title>

  <link rel="stylesheet" href="/assets/css/auth-gate.css" />
  <link rel="icon" href="/assets/images/Raid'sNTSHLogo.png">
</head>

<body>
  <main class="gate">
    <section class="card">
      <h1 class="logo">NTSH</h1>
      <p class="tagline">Nothing To See Here — Only Art That Speaks</p>

      <div class="choices">
        <button onclick="enterAs('viewer')">👀 Continue as Viewer</button>
        <button onclick="enterAs('guest')">🧍 Continue as Guest</button>
        <button onclick="enterAs('admin')">🖥 Admin</button>
      </div>

      <p class="hint">
        Viewers browse • Guests react • Artists upload
      </p>
    </section>
  </main>

  <script>
    function enterAs(role) {
      sessionStorage.clear();

      const map = {
        viewer: { role: "viewer", user: "viewer_001" },
        guest:  { role: "guest",  user: "guest_001" },
        admin:  { role: "admin",  user: "Raid" }
      };

      sessionStorage.setItem("ntsh_role", map[role].role);
      sessionStorage.setItem("ntsh_user", map[role].user);

      window.location.href = "/home.html";
    }
  </script>
</body>
</html>
