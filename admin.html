<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTSH • Admin Panel</title>
  
  <!-- STYLES -->
  <link rel="stylesheet" href="/assets/css/account-ui.css" />
  <link rel="stylesheet" href="/assets/css/gallery.css" />

  <!-- FAVICON -->
  <link rel="icon" type="image/x-icon" href="/assets/images/Raid'sNTSHLogo.png">
  <!-- Supabase UMD -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- Create client ONCE -->
<script src="/assets/js/supabase-client.js"></script>

<!-- Auth + role logic -->
<script src="/assets/js/auth.js"></script>

</head>

<body>
  <script>
  if (sessionStorage.getItem("ntsh_role") !== "admin") {
    alert("Admins only.");
    window.location.href = "/index.html";
  }
</script>



<!-- HEADER -->
<header class="account-header">
  <button id="accountBtn">
    <span id="accountAvatar">?</span>
    <span id="accountName">Loading…</span>
    <span id="roleBadge">admin</span>
  </button>

  <div id="accountMenu" class="menu">
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<!-- ADMIN PANEL -->
<main class="wrap">
  <section class="profile-card">
    <h1>Admin Panel</h1>
    <p>Review and approve submitted artwork</p>
  </section>

  <!-- Pending submissions -->
  <section class="portfolio-section">
    <h2>Pending Submissions</h2>
    <div id="pending-art"></div>
  </section>
</main>

</body>
</html>
