<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NTSH • Admin</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/account-ui.css" />
  <link rel="stylesheet" href="/css/admin.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Core UI Logic -->
  <script defer src="/js/account-ui.js"></script>
  <script defer src="/js/admin.js"></script>
</head>

<body data-role="admin">

<!-- =====================
     HEADER
===================== -->
<header class="site-header">
  <div class="header-center">
    <!-- NTSH LOGO IMAGE (TOP CENTER) -->
    <img
      src="/assets/Raid'sNTSHLogo.png"
      alt="NTSH"
      class="ntsh-logo"
    />
  </div>

  <button id="accountBtn" class="account-btn">
    <span id="accountAvatar">R</span>
    <span id="accountName">Raid</span>
    <span id="roleBadge" class="badge admin">ADMIN</span>
  </button>

  <div id="accountMenu" class="menu">
    <a href="/profile.html">Profile</a>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<!-- =====================
     ADMIN IDENTITY
===================== -->
<section class="admin-identity">
  <h1>Raid</h1>
  <p class="admin-sub">
    nothing to see here
  </p>
</section>

<!-- =====================
     PENDING ARTWORKS
===================== -->
<section class="admin-section">
  <h2>Pending Art</h2>

  <div id="pendingArtGrid" class="art-grid">
    <!-- JS injects pending artwork cards here -->

    <!-- Example structure (DO NOT HARD CODE):
    <div class="art-card">
      <img src="..." />
      <div class="art-overlay">
        <span class="art-title">Untitled</span>
        <span class="art-artist">@artist(pen)_003</span>
      </div>
      <div class="art-actions">
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </div>
    </div>
    -->

  </div>
</section>

<!-- =====================
     PENDING ARTISTS
===================== -->
<section class="admin-section">
  <h2>Pending Artists</h2>

  <div id="pendingArtistList" class="pending-artists">
    <!-- JS injects artist pending rows -->

    <!-- Example structure:
    <div class="artist-row">
      <span class="artist-id">artist(pen)_004</span>
      <span class="artist-meta">3 uploads</span>
      <div class="artist-actions">
        <button class="approve">Approve</button>
        <button class="reject">Reject</button>
      </div>
    </div>
    -->

  </div>
</section>

<!-- =====================
     FOOTER / EASTER EGG
===================== -->
<footer class="site-footer">
  <!-- Favicon Easter Egg -->
  <img
    src="/assets/Raid'sNTSHLogo.png"
    alt="NTSH Favicon"
    id="easterEggIcon"
    class="easter-egg"
  />
</footer>

</body>
</html>
