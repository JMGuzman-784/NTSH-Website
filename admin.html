<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NTSH • Admin</title>

  <!-- Core styles -->
  <link rel="stylesheet" href="/assets/css/account-ui.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared logic -->
  <script defer src="/assets/js/account-ui.js"></script>
  <link rel="icon" type="image/x-icon" href="/assets/images/Raid'sNTSHLogo.png">
</head>

<body data-role="admin">

<header class="admin-header">
  <div class="admin-title">
    <span class="admin-dot"></span>
    <h1>NTSH</h1>
  </div>
  <p class="admin-sub">Admin • Pending Review</p>
</header>

<main class="admin-wrap">
<section class="admin-upload">
  <h2>Upload Art (Raid)</h2>

  <input type="text" id="art-title" placeholder="Art title">

  <textarea id="art-description" placeholder="Short description"></textarea>

  <select id="art-type">
    <option value="">Type of art</option>
    <option value="Pencil">Pencil</option>
    <option value="Ink">Ink</option>
    <option value="Digital">Digital</option>
    <option value="Mixed">Mixed Media</option>
  </select>

  <select id="stencil-type">
    <option value="">Stencil type (optional)</option>
    <option value="Tattoo stencil">Tattoo stencil</option>
    <option value="Graffiti stencil">Graffiti stencil</option>
    <option value="None">None</option>
  </select>

  <input type="file" id="art-file" accept="image/*">

  <button id="upload-btn">Submit</button>

  <p id="upload-status"></p>

  <div class="socials">
    <p>@raids.art</p>
    <p>@ntsh.co</p>
  </div>
</section>

  <!-- Pending Art -->
  <section class="admin-section">
    <h2 class="section-title">Pending Art</h2>

    <div id="adminPendingGrid" class="pending-grid">
      <!-- JS injects cards here -->
      <!-- Placeholder for now -->
      <div class="pending-card ghost">
        <div class="ghost-img"></div>
        <div class="ghost-lines"></div>
      </div>
    </div>

  </section>

</main>

</body>
</html>
