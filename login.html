<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NTSH — Login</title>

  <link rel="stylesheet" href="/assets/css/auth-gate.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/auth.js"></script>

<script>
async function login(e) {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await window.supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  // 🔐 Role resolution
  if (email === "raid@ntsh.com") {
    sessionStorage.setItem("ntsh_role", "admin");
    sessionStorage.setItem("ntsh_user", "Raid");
    window.location.href = "/admin.html";
  } else {
    sessionStorage.setItem("ntsh_role", "artist");
    sessionStorage.setItem("ntsh_user", email.split("@")[0]);
    window.location.href = "/home.html";
  }
}
</script>

  <link rel="icon" href="/assets/images/Raid'sNTSHLogo.png">
</head>

<body>
  <main class="gate">
    <section class="card">
      <h1 class="logo">NTSH</h1>

      <form id="loginForm">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>

      <p class="hint">
        New here? <a href="/signup.html">Create an account</a>
      </p>
    </section>
  </main>
</body>
</html>
