<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NTSH — Login</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/login.css" />

  <!-- Supabase base (already clean) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/js/supabase-client.js"></script>
  <script src="/assets/js/auth-core.js"></script>
</head>

<body>
  <main class="login-wrap">

    <section class="login-card">

      <header class="brand">
        <h1 class="logo">NTSH</h1>
        <p class="subtitle">Nothing To See Here</p>
        <p class="tagline">Only Art That Speaks</p>
      </header>

      <div class="login-columns">

        <div class="login-option">
          <h2>Viewer</h2>
          <p>Browse approved artwork</p>
          <button class="ghost">Continue as Viewer</button>
        </div>

        <div class="login-option accent">
          <h2>Guest</h2>
          <p>React, comment, engage</p>
          <button class="ghost">Sign up as Guest</button>
        </div>

      </div>

      <div class="login-footer">
        <button class="primary">Log In</button>
        <p class="hint">Artists & Admins log in here</p>
      </div>

    </section>

  </main>
</body>
</html>
