<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NTSH • Member Access</title>
<link rel="icon" href="/assets/images/ntsh-mask-favicon-logo.png" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/login.css" />
</head>

<body class="centered" data-page="login">

  <main class="card glass">
    <h1 class="brand">NTSH</h1>
    <p class="subtitle">Member Access</p>

    <form id="loginForm">
  <input id="email" type="email" placeholder="Email" required />
  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
    required
  />

  <button id="loginBtn" class="btn primary" type="button">
    Log In
  </button>

  <button id="signupBtn" class="btn ghost" type="button">
    Create Account
  </button>
</form>


    <p class="hint">
      Guests are approved by admin • Artists upload after approval
    </p>
  </main>

 
  <script type="module" src="/assets/js/supabase-client.js"></script>
  <script type="module" src="/assets/js/login.js"></script>

</body>
</html>
